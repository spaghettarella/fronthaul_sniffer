log:
  filename: /tmp/ru_emu.log
  level: info

ru_emu:
  cells:
    - bandwidth: 100                # MHz
      network_interface: lo
      ru_mac_addr: 00:00:00:00:00:00
      du_mac_addr: 00:00:00:00:00:00
      enable_promiscuous: true
      dl_port_id: [0, 1, 2, 3]
      ul_port_id: [0, 1]
      prach_port_id: [4, 5]
      compr_method_ul: "bfp"
      compr_bitwidth_ul: 9
      t2a_max_cp_dl: 470
      t2a_min_cp_dl: 350
      t2a_max_cp_ul: 200
      t2a_min_cp_ul: 90
      t2a_max_up: 345
      t2a_min_up: 70
